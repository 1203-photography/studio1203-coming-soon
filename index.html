<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Studio-1203 and BrandWithMeDC are preparing a new online experience. Launching soon.">
  <title>Coming Soon | Studio-1203 &amp; BrandWithMeDC</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin: 0; min-height: 100vh; background: #fff; color: #171717; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    .page { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 22px 42px; }
    .content { width: 100%; max-width: 760px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .studio-logo { display: block; width: min(440px, 79vw); height: auto; }
    .brand-logo { display: block; width: min(320px, 64vw); height: auto; margin-top: 22px; }
    .rule { width: 42px; height: 1px; background: #bbb; margin: 67px auto 41px; }
    h1 { font-weight: 400; font-size: clamp(31px, 5vw, 48px); line-height: 1.18; letter-spacing: -.035em; margin: 0; }
    .intro { color: #626262; font-size: clamp(15px, 2.2vw, 17px); line-height: 1.85; margin: 24px 0 0; }
    .bottom { margin-top: 84px; font-size: 11px; letter-spacing: .15em; line-height: 2.15; text-transform: uppercase; color: #777; text-align: center; }
    @media (max-width: 540px) { .page { padding-top: 55px; padding-bottom: 36px; } .studio-logo { width: min(370px, 84vw); } .brand-logo { width: min(275px, 69vw); margin-top: 22px; } .rule { margin: 54px auto 35px; } .intro { max-width: 330px; } .bottom { margin-top: 66px; font-size: 10px; letter-spacing: .09em; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="content" aria-label="Coming soon announcement">
      <img class="studio-logo" src="studio1203-logo.png" alt="Studio-1203" width="1252" height="498">
      <img class="brand-logo" src="brandwithmedc-logo.png" alt="BrandWithMeDC" width="1777" height="198">
      <div class="rule" aria-hidden="true"></div>
      <h1>Something New Is Coming.</h1>
      <p class="intro">We're creating a new online experience.<br>Our new website is launching soon.</p>
      <div class="bottom">Photography &nbsp;·&nbsp; Personal Branding &nbsp;·&nbsp; Visual Strategy<br>Washington, DC &nbsp;·&nbsp; Maryland &nbsp;·&nbsp; Virginia</div>
    </section>
  </main>
</body>
</html>
